name: Upgrade formulas

on:
  workflow_dispatch:

concurrency:
  group: upgrade-formulas
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Authenticate private formula downloads
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "HOMEBREW_GITHUB_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Configure upgrade branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: formula-upgrades/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "$BASE_BRANCH"
          git switch --create "$BRANCH_NAME" "origin/$BASE_BRANCH"

      - name: Upgrade formulas from the latest releases
        id: upgrade
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: nnutter
        run: |
          formulae=()
          updated=()

          for formula_path in Formula/*.rb; do
            formula_name="$(basename "${formula_path%.rb}")"
            current_url="$(
              grep -oE \
                'https://github\.com/[^/]+/[^/]+/archive/refs/tags/[^"]+\.tar\.gz' \
                "$formula_path" || true
            )"
            if [[ -n "$current_url" ]]; then
              repository="${current_url#https://github.com/}"
              repository="${repository%%/archive/refs/tags/*}"
            else
              current_url="$(
                grep -oE \
                  'https://api\.github\.com/repos/[^/]+/[^/]+/tarball/[^"]+' \
                  "$formula_path" || true
              )"
              [[ -n "$current_url" ]] || continue
              repository="${current_url#https://api.github.com/repos/}"
              repository="${repository%%/tarball/*}"
            fi
            [[ "$repository" == "$OWNER/"* ]] || continue

            latest_tag="$(gh api "repos/$repository/releases/latest" --jq '.tag_name')"
            if [[ "$current_url" == https://api.github.com/* ]]; then
              latest_url="https://api.github.com/repos/$repository/tarball/$latest_tag"
            else
              latest_url="https://github.com/$repository/archive/refs/tags/$latest_tag.tar.gz"
            fi
            [[ "$current_url" == "$latest_url" ]] && continue

            bin/update-formula "$formula_name" "$latest_tag"
            formulae+=("nnutter/tap/$formula_name")
            updated+=("$repository → $latest_tag")
          done

          if (( ${#updated[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formula upgrades were found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          (IFS=,; echo "formulae=${formulae[*]}" >> "$GITHUB_OUTPUT")
          {
            echo "### Formula upgrades"
            printf -- '- %s\n' "${updated[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test formula upgrades
        if: steps.upgrade.outputs.changed == 'true'
        env:
          TESTING_FORMULAE: ${{ steps.upgrade.outputs.formulae }}
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup
          brew test-bot --only-tap-syntax
          brew test-bot --only-formulae --skip-online-checks --testing-formulae="$TESTING_FORMULAE"

      - name: Push upgrade branch
        if: steps.upgrade.outputs.changed == 'true'
        env:
          BRANCH_NAME: formula-upgrades/${{ github.run_id }}
        run: git push origin "HEAD:refs/heads/$BRANCH_NAME"

      - name: Open pull request
        if: steps.upgrade.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: formula-upgrades/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: nnutter
          REPOSITORY: ${{ github.repository }}
        run: |
          request_body="$(brew ruby -rjson -e '
            base, head, owner = ARGV
            puts JSON.generate(
              base: base,
              head: head,
              title: "Upgrade formulas",
              body: "Upgrade formulas for #{owner} repositories to their latest GitHub releases.",
            )
          ' -- "$BASE_BRANCH" "$BRANCH_NAME" "$OWNER")"
          pull_request_url="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$request_body" \
              "https://api.github.com/repos/$REPOSITORY/pulls" | \
              brew ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("html_url")'
          )"
          echo "Opened $pull_request_url" >> "$GITHUB_STEP_SUMMARY"
