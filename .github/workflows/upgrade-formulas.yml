name: Upgrade formulas

on:
  workflow_dispatch:

concurrency:
  group: upgrade-formulas
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Authenticate private formula downloads
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "HOMEBREW_GITHUB_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Configure upgrade branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: formula-upgrades/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "$BASE_BRANCH"
          git switch --create "$BRANCH_NAME" "origin/$BASE_BRANCH"

      - name: Upgrade formulas and macos-timber from the latest releases
        id: upgrade
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: nnutter
        run: |
          formulae=()
          updated=()

          for formula_path in Formula/*.rb; do
            formula_name="$(basename "${formula_path%.rb}")"
            current_url="$(
              grep -oE \
                'https://github\.com/[^/]+/[^/]+/archive/refs/tags/[^"]+\.tar\.gz' \
                "$formula_path" || true
            )"
            if [[ -n "$current_url" ]]; then
              repository="${current_url#https://github.com/}"
              repository="${repository%%/archive/refs/tags/*}"
            else
              current_url="$(
                grep -oE \
                  'https://api\.github\.com/repos/[^/]+/[^/]+/tarball/[^"]+' \
                  "$formula_path" || true
              )"
              [[ -n "$current_url" ]] || continue
              repository="${current_url#https://api.github.com/repos/}"
              repository="${repository%%/tarball/*}"
            fi
            [[ "$repository" == "$OWNER/"* ]] || continue

            latest_tag="$(gh api "repos/$repository/releases/latest" --jq '.tag_name')"
            if [[ "$current_url" == https://api.github.com/* ]]; then
              latest_url="https://api.github.com/repos/$repository/tarball/$latest_tag"
            else
              latest_url="https://github.com/$repository/archive/refs/tags/$latest_tag.tar.gz"
            fi
            [[ "$current_url" == "$latest_url" ]] && continue

            bin/update-formula "$formula_name" "$latest_tag"
            formulae+=("nnutter/tap/$formula_name")
            updated+=("$repository → $latest_tag")
          done

          cask_updated=false
          cask_path="Casks/macos-timber.rb"
          if [[ -f "$cask_path" ]]; then
            version_line="$(grep -E '^[[:space:]]*version "' "$cask_path" | head -n 1 || true)"
            version="${version_line#*\"}"
            version="${version%%\"*}"
            if [[ -z "$version" ]]; then
              echo "Casks/macos-timber.rb has no version." >&2
              exit 1
            fi
            latest_tag="$(gh api repos/nnutter/macos-timber/releases/latest --jq '.tag_name')"
            if [[ -z "$latest_tag" ]]; then
              echo "macos-timber has no latest release tag." >&2
              exit 1
            fi
            if [[ "v${version}" != "$latest_tag" ]]; then
              bin/update-macos-timber "$latest_tag"
              cask_updated=true
              updated+=("nnutter/macos-timber → $latest_tag")
            fi
          fi

          if (( ${#updated[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formula or cask upgrades were found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="Upgrade formulas"
          body="Upgrade formulas for ${OWNER} repositories to their latest GitHub releases."
          if [[ "$cask_updated" == "true" && ${#formulae[@]} -eq 0 ]]; then
            title="Upgrade macos-timber"
            body="Upgrade the macos-timber cask to its latest GitHub release."
          elif [[ "$cask_updated" == "true" ]]; then
            title="Upgrade formulas and macos-timber"
            body="Upgrade formulas and the macos-timber cask for ${OWNER} repositories to their latest GitHub releases."
          fi

          {
            echo "changed=true"
            echo "cask=${cask_updated}"
            echo "title=${title}"
            echo "body=${body}"
            if ((${#formulae[@]} > 0)); then
              IFS=,
              echo "formulae=${formulae[*]}"
              unset IFS
            fi
          } >> "$GITHUB_OUTPUT"
          {
            if [[ "$cask_updated" == "true" ]]; then
              echo "### Upgrades"
            else
              echo "### Formula upgrades"
            fi
            printf -- '- %s\n' "${updated[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test upgrades
        if: steps.upgrade.outputs.changed == 'true'
        env:
          TESTING_CASK: ${{ steps.upgrade.outputs.cask }}
          TESTING_FORMULAE: ${{ steps.upgrade.outputs.formulae }}
        run: |
          if [[ -n "$TESTING_FORMULAE" ]]; then
            IFS=',' read -r -a formulae <<< "$TESTING_FORMULAE"
            brew install --build-from-source "${formulae[@]}"
            brew test "${formulae[@]}"
          fi
          if [[ "$TESTING_CASK" == "true" ]]; then
            brew audit --cask --online nnutter/tap/macos-timber
            brew install --cask nnutter/tap/macos-timber
          fi

      - name: Push upgrade branch
        if: steps.upgrade.outputs.changed == 'true'
        env:
          BRANCH_NAME: formula-upgrades/${{ github.run_id }}
        run: git push origin "HEAD:refs/heads/$BRANCH_NAME"

      - name: Open pull request
        if: steps.upgrade.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BODY: ${{ steps.upgrade.outputs.body }}
          BRANCH_NAME: formula-upgrades/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TITLE: ${{ steps.upgrade.outputs.title }}
        run: |
          request_body="$(brew ruby -rjson -e '
            base, head = ARGV
            puts JSON.generate(
              base: base,
              head: head,
              title: ENV.fetch("TITLE"),
              body: ENV.fetch("BODY"),
            )
          ' -- "$BASE_BRANCH" "$BRANCH_NAME")"
          pull_request_url="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$request_body" \
              "https://api.github.com/repos/$REPOSITORY/pulls" | \
              brew ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("html_url")'
          )"
          echo "Opened $pull_request_url" >> "$GITHUB_STEP_SUMMARY"
