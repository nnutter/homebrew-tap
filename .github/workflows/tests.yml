name: brew test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-15-intel, macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The brew container cannot write GITHUB_OUTPUT until setup-homebrew
      # fixes mount permissions, so mint the app token after that.
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Authenticate private formula downloads
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "HOMEBREW_GITHUB_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install and test changed formulae
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          tap="$(brew --repo nnutter/tap)"
          git -C "$tap" fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          formulae=()
          while IFS= read -r file; do
            formulae+=("nnutter/tap/$(basename "${file%.rb}")")
          done < <(git -C "$tap" diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- Formula/)

          if ((${#formulae[@]} == 0)); then
            echo "No formula changes."
            exit 0
          fi

          brew install --build-from-source "${formulae[@]}"
          brew test "${formulae[@]}"
