[tools]
ruby = "4.0"

[tasks.test]
description = "Run the test suite"
run = "ruby test/update_formula_test.rb"

[tasks.lint]
description = "Run style checks"
run = "brew style ."

[tasks.check]
description = "Run all checks"
depends = ["test", "lint"]

[tasks.update]
description = "Update a formula from a GitHub tag archive URL"
run = "script/update-formula"
